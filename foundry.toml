[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000
bytecode_hash = "none"
cbor_metadata = false
ffi = false
additional_compiler_profiles = [
  { name = "evidence-via-ir", via_ir = true, optimizer = true, optimizer_runs = 200, evm_version = "cancun", bytecode_hash = "None" }
]
compilation_restrictions = [
  { paths = "test/vendor/PinnedPermit2Artifact.sol", version = "=0.8.17", via_ir = true },
  { paths = "test/FadeUniversalRouterTrade.t.sol", version = "=0.8.26", via_ir = true }
]
fs_permissions = [
  { access = "read", path = "./node_modules/@uniswap/universal-router/artifacts" },
  { access = "read", path = "./out" }
]

[profile.default.fuzz]
runs = 1_000
max_test_rejects = 65_536

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10_000, max_test_rejects = 65_536 }
invariant = { runs = 1_000, depth = 128, fail_on_revert = false }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
